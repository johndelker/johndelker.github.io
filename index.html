<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Static metadata fallbacks are mirrored in content.json for crawlers without JavaScript. -->
  <title>John Delker</title>
  <meta name="description" content="Personal academic website for John Delker, astrophysics and CMSE graduate student at Michigan State University." />
  <meta property="og:title" content="John Delker — Astrophysics &amp; CMSE" />
  <meta property="og:description" content="Research • Publications • Software • Teaching" />
  <meta property="og:type" content="website" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>✨</text></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0e0e10;
      --muted: #52525b;
      --accent: #3b82f6;
      --accent-weak: #dbeafe;
      --card: #f6f7fb;
      --border: #e5e7eb;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 14px;
      --maxw: 1000px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0c10;
        --text: #f3f4f6;
        --muted: #a1a1aa;
        --accent: #60a5fa;
        --accent-weak: #0b1220;
        --card: #111319;
        --border: #1f2937;
        --shadow: none;
      }
    }

    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial; color:var(--text); background:var(--bg); line-height:1.6; }
    a { color: var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width: var(--maxw); margin:0 auto; padding:24px; }

    header { position:sticky; top:0; backdrop-filter: saturate(140%) blur(8px); background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom:1px solid var(--border); z-index:10; }
    .nav { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    nav ul { list-style:none; display:flex; gap:12px; flex-wrap:wrap; margin:0; padding:0; }
    nav button {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid transparent;
      background: var(--accent);
      color: white;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      font-size: 1.1rem;
      opacity: 1;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s, background-color 0.2s;
    }
    nav button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    nav button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    nav button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .controls { display:flex; align-items:center; gap:12px; }

    .social a img { width:44px; height:44px; transition: transform 0.2s, opacity 0.2s; border-radius:6px; padding:2px; object-fit: contain; }
    .social a:hover img { transform: scale(1.2); opacity: 0.8; }

    .hero { display:grid; grid-template-columns:.8fr 1.2fr; gap:28px; align-items:center; padding:40px 0; }
    .hero h1 { margin:0; font-size:clamp(28px,6vw,44px); line-height:1.2; }
    .hero p.sub { color:var(--muted); }
    .portrait { display:flex; justify-content:center; align-items:flex-start; }
    .portrait img { width:360px; max-width:100%; height:auto; border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); }
    .muted { color:var(--muted); }
    section { padding:32px 0; }
    section[hidden] { display:none; }
    section h2 { font-size:clamp(22px,3.5vw,28px); margin:0 0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
    .grid { display:grid; gap:18px; }
    .g-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    #content-error { padding:32px 0; color:var(--muted); }

    footer { border-top:1px solid var(--border); color:var(--muted); padding:24px 0; }

    @media (max-width:860px){
      .hero { grid-template-columns: 1fr; }
      .nav { align-items:flex-start; flex-wrap:wrap; }
    }
    @media (max-width:600px){
      .wrap { padding:18px; }
      nav ul { gap:8px; }
      nav button { padding:8px 12px; font-size:1rem; }
      .g-2 { grid-template-columns:1fr; }
    }
  </style>
  <script src="site.js" defer></script>
</head>
<body>
  <header>
    <div class="wrap nav">
      <nav aria-label="Primary">
        <ul id="menu">
          <li><button type="button" data-view="home" aria-pressed="true">Home</button></li>
          <li><button type="button" data-view="research" aria-pressed="false">Research</button></li>
          <li><button type="button" data-view="software" aria-pressed="false">Software</button></li>
          <li><button type="button" data-view="teaching" aria-pressed="false">Teaching &amp; Outreach</button></li>
          <li><button type="button" data-view="other" aria-pressed="false">Other</button></li>
        </ul>
      </nav>
      <div class="controls social">
        <a href="mailto:jdelker@msu.edu" title="Email" aria-label="Email">
          <img src="images/email.png" alt="Email" />
        </a>
        <a href="https://orcid.org/0009-0008-5172-5307" title="ORCID" aria-label="ORCID">
          <img src="images/orcid.png" alt="ORCID" />
        </a>
        <a href="https://github.com/johndelker" title="GitHub" aria-label="GitHub">
          <img src="images/github.png" alt="GitHub" />
        </a>
        <a href="https://www.linkedin.com/in/johndelker" title="LinkedIn" aria-label="LinkedIn">
          <img src="images/linkedin.png" alt="LinkedIn" />
        </a>
      </div>
    </div>
  </header>
  <main class="wrap" id="main-content">
    <div id="content-error" role="alert" hidden></div>
    <section id="view-home" data-view-panel="home" aria-labelledby="home-title">
      <div class="hero">
        <div class="portrait" id="home-portrait"></div>
        <div id="home-copy"></div>
      </div>
    </section>
    <section id="view-research" data-view-panel="research" aria-labelledby="research-title" hidden></section>
    <section id="view-software" data-view-panel="software" aria-labelledby="software-title" hidden></section>
    <section id="view-teaching" data-view-panel="teaching" aria-labelledby="teaching-title" hidden></section>
    <section id="view-other" data-view-panel="other" aria-labelledby="other-title" hidden></section>
  </main>
  <footer>
    <div class="wrap">© <span id="y"></span> <span id="footer-name"></span></div>
  </footer>
</body>
</html>
